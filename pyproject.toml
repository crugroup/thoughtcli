[project]
name = "thoughtcli"
authors = [
    {name = "Marcin Szymanski", email = "marcin.szymanski@crugroup.com"},
    {name = "Jeremy Dang", email = "jeremy.dang@crugroup.com"}
]
description = "CLI for Thoughtspot"
requires-python = ">=3.10"
version = "0.7.0"

dependencies = [
    "thoughtspot_rest_api==2.0.3",
    "click>=8.1.7",
    "textual>=8.2.8",
    "pyyaml>=6.0.3"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
thcli = "thoughtcli:cli"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
